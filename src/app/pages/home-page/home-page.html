<main class="container">

  <h1 class="title">
    {{ title() }} ({{ numUsers() }} users)
  </h1>

  <app-control (orderByIdClick)="orderById()" (orderByNameClick)="orderByName()" (reverseClick)="reverse()"
    (search)="search($event)"></app-control>

  <section class="card-grid">

    @for (user of users(); track user.id) {

    <app-user-card [user]="user" (eliminateClick)="eliminateUser($event)"></app-user-card>

    }
    @empty {

    <p>No users left.</p>

    }

  </section>

</main>
